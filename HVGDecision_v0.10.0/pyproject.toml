[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hvgdecision"
version = "0.10.0"
description = "Auditable multi-donor HVG refinement with identifiability-aware automatic risk-branch routing"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "HVGDecision contributors"}]
keywords = ["single-cell", "HVG", "integration", "scRNA-seq", "feature-selection"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "anndata>=0.10",
  "numpy>=1.26",
  "pandas>=2.1",
  "PyYAML>=6.0",
  "scanpy>=1.10",
  "scikit-misc>=0.3",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "tqdm>=4.66",
]

[project.optional-dependencies]
downstream = [
  "bbknn>=1.6",
  "harmonypy>=0.0.10",
  "scanorama>=1.7",
  "scvi-tools>=1.2",
]
integration = [
  "bbknn>=1.6",
  "harmonypy>=0.0.10",
  "scanorama>=1.7",
]
scvi = ["scvi-tools>=1.2"]
all = [
  "bbknn>=1.6",
  "harmonypy>=0.0.10",
  "scanorama>=1.7",
  "scvi-tools>=1.2",
]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Repository = "https://github.com/babySherlock/HVGdecision"

[project.scripts]
hvgdecision = "hvgdecision.cli:main"
hvgdecision-legacy = "hvgdecision.legacy_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
