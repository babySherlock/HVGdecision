[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hvgdecision-reference-query-patch"
version = "0.10.1"
description = "Reference-to-Query transfer workflow patch for HVGDecision 0.10.0"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "HVGDecision contributors"}]
dependencies = [
  "hvgdecision>=0.10.0",
  "anndata>=0.10",
  "numpy>=1.26",
  "pandas>=2.1",
  "scanpy>=1.10",
  "scikit-misc>=0.3",
  "scipy>=1.11",
]

[tool.setuptools.packages.find]
where = ["src"]
